[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["core", "accounts", "inventory", "procurement", "sales", "losses"]
omit = [
    "*/migrations/*",
    "*/admin.py",
    "*/apps.py",
    "*/tests/*",
    "manage.py",
    "config/*",
    "*/views.py",
    "*/urls.py",
    "*/serializers.py",
]

[tool.coverage.report]
fail_under = 70  # se activează în sesiunea 3 (spec M2, pasul 13)
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]

[tool.ruff.lint.per-file-ignores]
# dev.py/prod.py extind base.py prin star-import — e patternul de settings-split ales
# în M0, nu o greșeală de import (regula DJ012/F403 nu se aplică aici).
"config/settings/dev.py" = ["F403"]
"config/settings/prod.py" = ["F403"]
# Supplier.cif: null=True e intenționat, nu blank=True + "" (decizie 2026-08-21). Există
# deja un UniqueConstraint pe cif — mai mulți furnizori fără CIF trebuie să poată coexista.
# NULL != NULL în Postgres, deci nu lovește unicitatea; "" == "" ar lovi-o la al doilea
# furnizor fără CIF. Schimbarea la blank=True ar introduce un bug, nu l-ar repara.
"procurement/models.py" = ["DJ001"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

# djangorestframework și django-environ n-au stub-uri de tip proprii (django-stubs
# acoperă doar Django); mypy nu poate verifica interiorul lor — nu e o eroare de logică.
[[tool.mypy.overrides]]
module = ["rest_framework.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
